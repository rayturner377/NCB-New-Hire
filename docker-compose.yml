name: ncbmedical

services:
  postgres:
    image: postgres:16-alpine
    container_name: ncbmedical-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ncb_medical_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ncb_medical
    volumes:
      - ncb-medical-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncb_medical_app -d ncb_medical"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ncbmedical-redis
    restart: unless-stopped
    # requirepass even for local dev — an unauthenticated Redis holding
    # session data shouldn't ship by default, same posture as requiring
    # POSTGRES_PASSWORD above rather than leaving Postgres open.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "6380:6379"
    volumes:
      - ncb-medical-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # smtp4dev — local development mail catcher. Accepts every email unconditionally and never
  # actually delivers it anywhere; view what got "sent" at http://localhost:5000. Point Settings →
  # Mail at host=localhost (or smtp4dev if running the web app via this same compose file's own
  # `web` service, on the compose network), port=25, secure=false, no username/password — nodemailer
  # needs no auth against it. This is a different layer than the app's own Message Centre: Message
  # Centre is this app's own audit record that a send was attempted (survives even if SMTP is
  # completely unreachable); smtp4dev shows the real email as it would actually arrive — real
  # headers, real MIME/HTML rendering — for testing delivery itself, e.g. verifying a real OTP
  # actually arrives during local dev with no mail server of your own configured.
  # SECURITY: every published port is bound to 127.0.0.1 (localhost only) — smtp4dev has no
  # authentication of its own, so anyone who could reach these ports could read every captured
  # email, OTP codes included. Never remove that binding or expose this on a shared network.
  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: ncbmedical-smtp4dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:80"  # Web UI
      - "127.0.0.1:25:25"    # SMTP — this is what Settings → Mail talks to
    volumes:
      - ncb-medical-smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=smtp4dev

  # One-shot: applies Prisma migrations before the app starts. Kept separate
  # from `web` so a migration failure is visible on its own, matching how
  # .github/workflows/ci.yml's integration-tests job separates the two.
  migrate:
    build:
      context: .
    image: ncbmedical:local
    command: ["npm", "run", "migrate:deploy", "-w", "@ncb/database"]
    environment:
      DATABASE_URL: postgresql://ncb_medical_app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ncb_medical?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
    image: ncbmedical:local
    container_name: ncbmedical
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Explicit so a stale PORT left over from the old .env.example (8080,
      # the legacy server's port) can't silently change what next start
      # binds to — environment: here wins over whatever env_file loaded.
      PORT: 3000
      DATABASE_URL: postgresql://ncb_medical_app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ncb_medical?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
    volumes:
      # npm workspace commands (npm run start -w @ncb/web) run with cwd set
      # to the workspace directory, so master-key.ts's process.cwd()-relative
      # data/master.key path resolves under apps/web, not the repo root.
      - ./data:/app/apps/web/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  ncb-medical-postgres-data:
    name: ncbmedical-postgres-data
  ncb-medical-redis-data:
    name: ncbmedical-redis-data
  ncb-medical-smtp4dev-data:
    name: ncbmedical-smtp4dev-data
