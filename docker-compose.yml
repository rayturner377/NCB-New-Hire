name: ncbmedical

services:
  postgres:
    image: postgres:16-alpine
    container_name: ncbmedical-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ncb_medical_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ncb_medical
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?set AUDIT_DB_PASSWORD in .env}
      APP_RUNTIME_DB_PASSWORD: ${APP_RUNTIME_DB_PASSWORD:?set APP_RUNTIME_DB_PASSWORD in .env}
    volumes:
      - ncb-medical-postgres-data:/var/lib/postgresql/data
      # Runs once, only against a freshly-created (empty) data directory — see
      # docker/postgres-init's own script comment. An already-initialized volume needs this applied
      # by hand once (see DATABASE.md).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncb_medical_app -d ncb_medical"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ncbmedical-redis
    restart: unless-stopped
    # requirepass even for local dev — an unauthenticated Redis holding
    # session data shouldn't ship by default, same posture as requiring
    # POSTGRES_PASSWORD above rather than leaving Postgres open.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "6380:6379"
    volumes:
      - ncb-medical-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # smtp4dev — local development mail catcher. Accepts every email unconditionally and never
  # actually delivers it anywhere; view what got "sent" at http://localhost:5000. Point Settings →
  # Mail at host=localhost (or smtp4dev if running the web app via this same compose file's own
  # `web` service, on the compose network), port=25, secure=false, no username/password — nodemailer
  # needs no auth against it. This is a different layer than the app's own Message Centre: Message
  # Centre is this app's own audit record that a send was attempted (survives even if SMTP is
  # completely unreachable); smtp4dev shows the real email as it would actually arrive — real
  # headers, real MIME/HTML rendering — for testing delivery itself, e.g. verifying a real OTP
  # actually arrives during local dev with no mail server of your own configured.
  # SECURITY: every published port is bound to 127.0.0.1 (localhost only) — smtp4dev has no
  # authentication of its own, so anyone who could reach these ports could read every captured
  # email, OTP codes included. Never remove that binding or expose this on a shared network.
  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: ncbmedical-smtp4dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:80"  # Web UI
      - "127.0.0.1:25:25"    # SMTP — this is what Settings → Mail talks to
    volumes:
      - ncb-medical-smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=smtp4dev

  # One-shot: applies Prisma migrations before the app starts. Kept separate
  # from `web` so a migration failure is visible on its own, matching how
  # .github/workflows/ci.yml's integration-tests job separates the two.
  # Deliberately still authenticates as ncb_medical_app (the owning/superuser role that created
  # every table) — migrations need real DDL rights, which no other role has or should have. `web`
  # below uses a genuinely different, non-superuser credential for its own live runtime connection.
  migrate:
    build:
      context: .
    image: ncbmedical:local
    command: ["npm", "run", "migrate:deploy", "-w", "@ncb/database"]
    environment:
      DATABASE_URL: postgresql://ncb_medical_app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ncb_medical?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
    image: ncbmedical:local
    container_name: ncbmedical
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Deliberately NOT `env_file: .env` — confirmed via external security review that blanket-loading
    # the whole file into this container defeated the entire point of the ncb_app_runtime split above
    # a compromised web process could just read POSTGRES_PASSWORD (ncb_medical_app, the superuser)
    # straight out of its own environment and connect as the owner directly, bypassing the restricted
    # runtime role entirely. .env also carries a lot of legacy cruft (SMTP_*, DATABASE_HOST/PORT/etc.,
    # CLOUDSQL_*, INIT_*) from before this app's current Prisma/Next.js stack that nothing here reads
    # at all — no reason for any of it to reach this process either. Every var this app's own source
    # actually reads via `process.env` (confirmed by grep, not assumed) is listed explicitly below;
    # `.env` is still used for `${...}` substitution as always, just no longer forwarded wholesale.
    environment:
      # Explicit so a stale PORT left over from the old .env.example (8080,
      # the legacy server's port) can't silently change what next start
      # binds to.
      PORT: 3000
      # ncb_app_runtime, not ncb_medical_app (the migration/ownership role, a Postgres superuser) —
      # see docker/postgres-init's own role-creation script for why the running app never
      # authenticates as the superuser that owns every table. This role has ordinary CRUD on every
      # business table and explicitly none at all on audit_events (see migration
      # 0026_app_runtime_role) — that table is only ever reached via AUDIT_DATABASE_URL below.
      DATABASE_URL: postgresql://ncb_app_runtime:${APP_RUNTIME_DB_PASSWORD:?set APP_RUNTIME_DB_PASSWORD in .env}@postgres:5432/ncb_medical?schema=public
      # A separate, least-privileged role for audit_events specifically — see
      # packages/database/src/client.ts's own createAuditPrismaClient() and
      # docker/postgres-init's role-creation script for why this isn't just DATABASE_URL again.
      AUDIT_DATABASE_URL: postgresql://ncb_audit_writer:${AUDIT_DB_PASSWORD:?set AUDIT_DB_PASSWORD in .env}@postgres:5432/ncb_medical?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      # Malware scanning for uploaded case attachments is an optional, deployment-specific
      # integration — see lib/virus-scan.ts's own doc comment. Unset here (the default) means
      # scanning stays off and attachments behave exactly as they did before this feature existed;
      # a real deployment that wires in its own scanner sets VIRUS_SCAN_ENABLED=true once
      # lib/virus-scan.ts's scanBuffer() actually calls it.
      # VIRUS_SCAN_ENABLED: "true"
      # Everything below is genuinely optional app config, not a secret this container needs kept
      # away from anything else — each has a safe built-in default when left empty (see the
      # app/auth code each one feeds), so a plain `${VAR}` reference (blank if unset in .env, not a
      # hard failure) is intentional here, unlike the `:?required` secrets above.
      APP_MASTER_KEY: ${APP_MASTER_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      COOKIE_SECURE: ${COOKIE_SECURE}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES}
    volumes:
      # npm workspace commands (npm run start -w @ncb/web) run with cwd set
      # to the workspace directory, so master-key.ts's process.cwd()-relative
      # data/master.key path resolves under apps/web, not the repo root.
      - ./data:/app/apps/web/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  ncb-medical-postgres-data:
    name: ncbmedical-postgres-data
  ncb-medical-redis-data:
    name: ncbmedical-redis-data
  ncb-medical-smtp4dev-data:
    name: ncbmedical-smtp4dev-data
