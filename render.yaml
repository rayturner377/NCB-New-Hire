services:
  - type: web
    name: ncb-medical-platform
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && npm run migrate:deploy -w @ncb/database
    startCommand: npm run start -w @ncb/web
    envVars:
      - key: COOKIE_SECURE
        value: true
      - key: APP_MASTER_KEY
        generateValue: true
      - key: SESSION_TIMEOUT_MINUTES
        value: 15
      - key: DATABASE_URL
        sync: false
