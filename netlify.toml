[build]
  publish = "public"
  command = "echo 'No frontend build required'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/submissions/*"
  to = "/.netlify/functions/api"
  status = 200
