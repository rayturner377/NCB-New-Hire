name: CI

on:
  push:
    branches: [main, foundation, postgres-cutover]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: node --check server.js

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:coverage

      - run: npm run build
