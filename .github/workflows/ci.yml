name: CI

on:
  push:
    branches: [main, foundation, postgres-cutover]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    services:
      # @ncb/redis's client connects eagerly at import time (a deliberate "fail loudly if
      # infrastructure is unreachable" posture for the real running app — see client.ts's own doc
      # comment), and at least one unit test (packages/auth's utils.test.ts, transitively) reaches
      # it without mocking @ncb/redis. A syntactically-valid-but-unreachable REDIS_URL isn't enough
      # here the way it is for DATABASE_URL (Prisma only connects lazily, on the first real query,
      # which nothing in this job's unit tests actually issues) — ioredis's real, async connection
      # errors against an unreachable host collide with Vitest's worker teardown and fail the run
      # even though every assertion passed. No password, same reasoning as the integration-tests
      # job's own redis service below: a GH Actions service container can't take a custom command
      # line the way docker-compose's --requirepass does, and this only exists for one CI run.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # @ncb/database's Prisma schema resolves DATABASE_URL at `prisma generate`
      # time even though nothing in this job opens a real connection (Prisma
      # connects lazily, on the first real query, and unit tests mock the
      # Prisma client anyway) — a syntactically valid placeholder is enough.
      # The real Postgres instance is only used by the integration-tests job
      # below.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-build-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom (used by every DOM-based unit test here) pulls in undici ^8.x, which calls a Node
          # internal (webidl.util.markAsUncloneable) only reliably present from Node 22 onward — on
          # Node 20 it's undefined, crashing every jsdom-environment test worker at import time. That
          # silently drops those files' branches out of the coverage total, which is why
          # test:coverage's 85% branch threshold failed here even though nothing regressed.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:coverage

      - run: npm run build

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ncb_medical_app
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: ncb_medical_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ncb_medical_app -d ncb_medical_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # @ncb/database's audit repository imports @ncb/redis eagerly (its independent chain-
      # checkpoint — see audit.ts's own doc comment) — every integration test that touches it,
      # not just the audit-specific ones, throws "REDIS_URL is not set" without a real Redis here.
      # No password: unlike docker-compose.yml's own redis service (--requirepass, a real posture
      # for anything long-lived), a GitHub Actions `services:` entry can't be given a custom command
      # line at all, and this container only ever exists for the few minutes of this one job run on
      # an isolated runner — not a real deployment, nothing worth authenticating against here.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ncb_medical_app:ci_test_password@localhost:5432/ncb_medical_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # @ncb/database imports @ncb/shared and @ncb/redis by their compiled dist/ output (their own
      # package.json "main" fields point there) — a fresh `npm ci` never builds anything, so without
      # this, `npm run test:integration -w @ncb/database` (invoked directly here, bypassing turbo/its
      # own ^build dependsOn) fails to resolve either package. `--filter=@ncb/database^...` builds
      # exactly its workspace dependencies, not @ncb/database itself (its own build needs a real
      # DATABASE_URL for `prisma generate`, which this step doesn't have yet).
      - run: npx turbo run build --filter=@ncb/database^...

      - run: npm run migrate:deploy -w @ncb/database

      - run: npm run test:integration -w @ncb/database
